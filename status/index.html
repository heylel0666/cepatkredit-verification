<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cepat Kredit - Verification Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #31b235 0%, #fcff00 50%, #31b235 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1e293b; }
    .container { max-width: 420px; width: 100%; margin: 20px; }
    .card { background: white; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden; }
    .card-header { padding: 28px 28px 0; text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #6463af, #5251a0); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; font-weight: 700; }
    .brand-name { font-size: 20px; font-weight: 700; color: #0f172a; }
    .header-sub { color: #64748b; font-size: 14px; margin-top: 4px; }
    .card-body { padding: 24px 28px 28px; }

    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #334155; }
    .input-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; font-family: inherit; outline: none; transition: all 0.2s; background: #f8fafc; }
    .input-group input:focus { border-color: #6463af; background: white; box-shadow: 0 0 0 3px rgba(100,99,175,0.1); }

    .btn { padding: 13px 24px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s; font-family: inherit; }
    .btn-primary { background: linear-gradient(135deg, #6463af, #5251a0); color: white; box-shadow: 0 4px 14px rgba(100,99,175,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(100,99,175,0.4); }
    .btn-primary:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .btn-secondary:hover { background: #e2e8f0; }

    .status-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; }
    .badge-pending { background: #f0f0ff; color: #6463af; }
    .badge-processing { background: #fffbeb; color: #d97706; }
    .badge-review { background: #fef3c7; color: #b45309; }
    .badge-approved { background: #dcfce7; color: #15803d; }
    .badge-declined { background: #fef2f2; color: #dc2626; }
    .badge-failed { background: #fef2f2; color: #dc2626; }

    .status-msg { color: #64748b; font-size: 14px; line-height: 1.6; margin-top: 12px; }

    .detail { margin-top: 20px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #64748b; font-size: 13px; }
    .detail-value { font-weight: 600; color: #0f172a; font-size: 14px; text-align: right; }

    .spinner-sm { width: 18px; height: 18px; border: 2.5px solid #e2e8f0; border-top-color: #6463af; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .refresh-bar { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; background: #f0f0ff; border-radius: 10px; margin-top: 16px; font-size: 13px; color: #6463af; font-weight: 500; }
    .error-text { color: #dc2626; font-size: 13px; margin-top: 8px; text-align: center; }
    .icon-status { font-size: 56px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <div class="brand">
          <div class="brand-icon">CK</div>
          <span class="brand-name">Cepat Kredit</span>
        </div>
        <p class="header-sub">Verification Status</p>
      </div>
      <div class="card-body">
        <div id="searchSection">
          <div class="input-group">
            <label>Session ID</label>
            <input type="text" id="sessionIdInput" placeholder="Paste your session ID">
          </div>
          <button class="btn btn-primary" id="checkBtn" onclick="checkStatus()">Check Status</button>
          <p id="errorMsg" class="error-text"></p>
        </div>

        <div id="resultSection" style="display:none; text-align:center;">
          <div id="statusIcon"></div>
          <div id="statusBadge"></div>
          <div id="statusMessage"></div>
          <div id="detailSection"></div>
          <div id="refreshNote"></div>
          <button class="btn btn-secondary" onclick="resetSearch()" style="margin-top:20px;">Check Another</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://yuhorlwmiafhupaunrun.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1aG9ybHdtaWFmaHVwYXVucnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODk5NzksImV4cCI6MjEwMzI2NTk3OX0.2nmIj_W_hOZNcuEOKZSbZQiUF2NtIFvREdgJQ_f5wHc';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let pollTimer = null;

    const urlParams = new URLSearchParams(window.location.search);
    const urlSession = urlParams.get('session');
    if (urlSession) { document.getElementById('sessionIdInput').value = urlSession; setTimeout(() => checkStatus(), 500); }

    window.checkStatus = async function() {
      const inputId = document.getElementById('sessionIdInput').value.trim();
      document.getElementById('errorMsg').textContent = '';
      if (!inputId) { document.getElementById('errorMsg').textContent = 'Please enter a session ID.'; return; }
      document.getElementById('checkBtn').disabled = true;
      document.getElementById('checkBtn').textContent = 'Checking...';
      const { data: session, error } = await supabase.from('sessions').select('session_id, status, first_name, last_name, document_type, document_number, date_of_birth, gender, issuing_state, created_at, updated_at').eq('session_id', inputId).single();
      document.getElementById('checkBtn').disabled = false;
      document.getElementById('checkBtn').textContent = 'Check Status';
      if (error || !session) { document.getElementById('errorMsg').textContent = 'Session not found.'; return; }
      showResult(session);
    }

    function showResult(session) {
      document.getElementById('searchSection').style.display = 'none';
      document.getElementById('resultSection').style.display = 'block';

      const statusMap = {
        'NOT_STARTED': { icon: '⏳', label: 'Not Started', cls: 'badge-pending', msg: 'Your verification has not been started yet.' },
        'IN_PROGRESS': { icon: '⚙️', label: 'Processing', cls: 'badge-processing', msg: 'Your documents are being processed. Please wait...' },
        'PROCESSING_IMAGES': { icon: '⚙️', label: 'Processing', cls: 'badge-processing', msg: 'Analyzing your documents...' },
        'IN_REVIEW': { icon: '👀', label: 'Under Review', cls: 'badge-review', msg: 'Your documents have been received and are under review by our team.' },
        'APPROVED': { icon: '✅', label: 'Approved', cls: 'badge-approved', msg: 'Your identity has been verified. You are all set!' },
        'DECLINED': { icon: '❌', label: 'Declined', cls: 'badge-declined', msg: 'Your verification was not approved. Please contact support.' },
        'PROCESSING_FAILED': { icon: '❌', label: 'Failed', cls: 'badge-declined', msg: 'An error occurred. Please try again.' },
      };

      const info = statusMap[session.status] || { icon: '❓', label: session.status, cls: 'badge-pending', msg: '' };

      document.getElementById('statusIcon').innerHTML = '<div class="icon-status">' + info.icon + '</div>';
      document.getElementById('statusBadge').innerHTML = '<span class="status-badge ' + info.cls + '">' + info.label + '</span>';
      document.getElementById('statusMessage').innerHTML = '<p class="status-msg">' + info.msg + '</p>';

      const showDetails = ['IN_REVIEW', 'APPROVED', 'DECLINED'].includes(session.status);
      if (showDetails) {
        const rows = [];
        if (session.first_name || session.last_name) rows.push(['Name', (session.first_name || '') + ' ' + (session.last_name || '')]);
        if (session.document_type) rows.push(['Document Type', session.document_type]);
        if (session.document_number) rows.push(['Document Number', session.document_number]);
        if (session.date_of_birth) rows.push(['Date of Birth', session.date_of_birth]);
        if (session.gender) rows.push(['Gender', session.gender]);
        rows.push(['Submitted', new Date(session.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })]);
        if (rows.length > 0) {
          let html = '<div class="detail">';
          for (const [label, value] of rows) html += '<div class="detail-row"><span class="detail-label">' + label + '</span><span class="detail-value">' + value + '</span></div>';
          html += '</div>';
          document.getElementById('detailSection').innerHTML = html;
        }
      }

      if (pollTimer) clearInterval(pollTimer);
      if (['NOT_STARTED', 'IN_PROGRESS', 'PROCESSING_IMAGES'].includes(session.status)) {
        let count = 0;
        document.getElementById('refreshNote').innerHTML = '<div class="refresh-bar"><span class="spinner-sm"></span> Auto-refreshing...</div>';
        pollTimer = setInterval(async () => {
          count++;
          if (count > 60) { clearInterval(pollTimer); document.getElementById('refreshNote').innerHTML = ''; return; }
          const { data } = await supabase.from('sessions').select('session_id, status, first_name, last_name, document_type, document_number, date_of_birth, gender, issuing_state, created_at, updated_at').eq('session_id', session.session_id).single();
          if (data && ['IN_REVIEW', 'APPROVED', 'DECLINED', 'PROCESSING_FAILED'].includes(data.status)) { clearInterval(pollTimer); document.getElementById('refreshNote').innerHTML = ''; showResult(data); }
        }, 3000);
      }
    }

    window.resetSearch = function() {
      if (pollTimer) clearInterval(pollTimer);
      document.getElementById('searchSection').style.display = 'block';
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('sessionIdInput').value = '';
      document.getElementById('errorMsg').textContent = '';
    };
  </script>
</body>
</html>
