<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cepat Kredit - Verification Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1a1a2e; }
    .container { max-width: 440px; width: 100%; margin: 20px; }

    .card { background: linear-gradient(135deg, #43c947 0%, #7ad64e 20%, #c4e944 40%, #f0f43d 60%, #c4e944 80%, #43c947 100%); border-radius: 28px; box-shadow: 0 20px 60px rgba(49,178,53,0.2), 0 4px 16px rgba(0,0,0,0.06); overflow: hidden; position: relative; }
    .card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 25% 15%, rgba(255,255,255,0.45) 0%, transparent 55%); pointer-events: none; }
    .card-inner { background: white; margin: 6px; border-radius: 22px; padding: 20px 28px 28px; position: relative; z-index: 1; }

    .card-header { text-align: center; margin-bottom: 4px; }
    .brand { display: inline-flex; align-items: center; gap: 0; margin-bottom: 0; }
    .brand-icon { width: 60px; height: 60px; overflow: hidden; }
    .brand-icon img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(39%) sepia(56%) saturate(539%) hue-rotate(80deg) brightness(95%); }
    .brand-name { font-size: 22px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.3px; }
    .header-sub { color: #8b8ba3; font-size: 13px; font-weight: 500; margin-top: 0; }

    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 12px; color: #555570; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group input { width: 100%; padding: 14px 16px; border: 2px solid #eaeaf0; border-radius: 12px; font-size: 15px; font-family: inherit; outline: none; transition: all 0.25s; background: #fafafe; }
    .input-group input:focus { border-color: #6463af; background: white; box-shadow: 0 0 0 4px rgba(100,99,175,0.1); }
    .input-group input::placeholder { color: #b8b8cc; }

    .btn { padding: 14px 24px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.25s; font-family: inherit; letter-spacing: 0.2px; }
    .btn-primary { background: linear-gradient(135deg, #6463af, #4e4d9e); color: white; box-shadow: 0 4px 16px rgba(100,99,175,0.35); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(100,99,175,0.4); }
    .btn-primary:disabled { background: #d4d4e0; box-shadow: none; cursor: not-allowed; transform: none; color: #8b8ba3; }
    .btn-secondary { background: #f3f3f8; color: #555570; border: 1.5px solid #eaeaf0; }
    .btn-secondary:hover { background: #eaeaf0; border-color: #d4d4e0; }

    .status-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .badge-pending { background: #f3f2ff; color: #6463af; }
    .badge-processing { background: #fffbeb; color: #d97706; }
    .badge-review { background: #fef3c7; color: #b45309; }
    .badge-approved { background: #e6f9e6; color: #1a8a2e; }
    .badge-declined { background: #fff0f0; color: #dc2626; }
    .badge-failed { background: #fff0f0; color: #dc2626; }

    .status-msg { color: #8b8ba3; font-size: 13px; line-height: 1.7; margin-top: 14px; }

    .detail { margin-top: 20px; background: #fafafe; border-radius: 14px; border: 1.5px solid #eeeef5; overflow: hidden; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; border-bottom: 1px solid #f5f5fa; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #8b8ba3; font-size: 12px; font-weight: 500; }
    .detail-value { font-weight: 600; color: #1a1a2e; font-size: 13px; text-align: right; }

    .spinner-sm { width: 18px; height: 18px; border: 2.5px solid #f0f0f5; border-top-color: #6463af; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .refresh-bar { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; background: #f3f2ff; border-radius: 12px; margin-top: 16px; font-size: 12px; color: #6463af; font-weight: 500; }
    .error-text { color: #dc2626; font-size: 13px; margin-top: 10px; text-align: center; }
    .icon-status { font-size: 56px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-inner">
        <div class="card-header">
          <div class="brand">
            <img src="https://heylel0666.github.io/cepatkredit-verification/logo.avif" alt="Cepat Kredit" style="width:250px;height:250px;object-fit:contain;filter:brightness(0) invert(39%) sepia(56%) saturate(539%) hue-rotate(80deg) brightness(95%);">
          </div>
          <p class="header-sub">Verification Status</p>
        </div>

        <div id="searchSection">
          <div class="input-group">
            <label>Session ID</label>
            <input type="text" id="sessionIdInput" placeholder="Paste your session ID">
          </div>
          <button class="btn btn-primary" id="checkBtn" onclick="checkStatus()">Check Status</button>
          <p id="errorMsg" class="error-text"></p>
        </div>

        <div id="resultSection" style="display:none; text-align:center;">
          <div id="statusIcon"></div>
          <div id="statusBadge"></div>
          <div id="statusMessage"></div>
          <div id="detailSection"></div>
          <div id="refreshNote"></div>
          <button class="btn btn-secondary" onclick="resetSearch()" style="margin-top:20px;">Check Another</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://yuhorlwmiafhupaunrun.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1aG9ybHdtaWFmaHVwYXVucnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODk5NzksImV4cCI6MjEwMzI2NTk3OX0.2nmIj_W_hOZNcuEOKZSbZQiUF2NtIFvREdgJQ_f5wHc';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let pollTimer = null;

    const urlParams = new URLSearchParams(window.location.search);
    const urlSession = urlParams.get('session');
    if (urlSession) { document.getElementById('sessionIdInput').value = urlSession; setTimeout(() => checkStatus(), 500); }

    window.checkStatus = async function() {
      const inputId = document.getElementById('sessionIdInput').value.trim();
      document.getElementById('errorMsg').textContent = '';
      if (!inputId) { document.getElementById('errorMsg').textContent = 'Please enter a session ID.'; return; }
      document.getElementById('checkBtn').disabled = true;
      document.getElementById('checkBtn').textContent = 'Checking...';
      const { data: session, error } = await supabase.from('sessions').select('session_id, status, first_name, last_name, document_type, document_number, date_of_birth, gender, issuing_state, created_at, updated_at').eq('session_id', inputId).single();
      document.getElementById('checkBtn').disabled = false;
      document.getElementById('checkBtn').textContent = 'Check Status';
      if (error || !session) { document.getElementById('errorMsg').textContent = 'Session not found.'; return; }
      showResult(session);
    }

    function showResult(session) {
      document.getElementById('searchSection').style.display = 'none';
      document.getElementById('resultSection').style.display = 'block';

      const statusMap = {
        'NOT_STARTED': { icon: '&#9203;', label: 'Not Started', cls: 'badge-pending', msg: 'Your verification has not been started yet.' },
        'IN_PROGRESS': { icon: '&#9881;', label: 'Processing', cls: 'badge-processing', msg: 'Your documents are being processed. Please wait...' },
        'PROCESSING_IMAGES': { icon: '&#9881;', label: 'Processing', cls: 'badge-processing', msg: 'Analyzing your documents...' },
        'IN_REVIEW': { icon: '&#128064;', label: 'Under Review', cls: 'badge-review', msg: 'Your documents have been received and are under review by our team.' },
        'APPROVED': { icon: '&#9989;', label: 'Approved', cls: 'badge-approved', msg: 'Your identity has been verified. You are all set!' },
        'DECLINED': { icon: '&#10060;', label: 'Declined', cls: 'badge-declined', msg: 'Your verification was not approved. Please contact support.' },
        'PROCESSING_FAILED': { icon: '&#10060;', label: 'Failed', cls: 'badge-declined', msg: 'An error occurred. Please try again.' },
      };

      const info = statusMap[session.status] || { icon: '&#10067;', label: session.status, cls: 'badge-pending', msg: '' };

      document.getElementById('statusIcon').innerHTML = '<div class="icon-status">' + info.icon + '</div>';
      document.getElementById('statusBadge').innerHTML = '<span class="status-badge ' + info.cls + '">' + info.label + '</span>';
      document.getElementById('statusMessage').innerHTML = '<p class="status-msg">' + info.msg + '</p>';

      const showDetails = ['IN_REVIEW', 'APPROVED', 'DECLINED'].includes(session.status);
      if (showDetails) {
        const rows = [];
        if (session.first_name || session.last_name) rows.push(['Name', (session.first_name || '') + ' ' + (session.last_name || '')]);
        if (session.document_type) rows.push(['Document Type', session.document_type]);
        if (session.document_number) rows.push(['Document Number', session.document_number]);
        if (session.date_of_birth) rows.push(['Date of Birth', session.date_of_birth]);
        if (session.gender) rows.push(['Gender', session.gender]);
        rows.push(['Submitted', new Date(session.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })]);
        if (rows.length > 0) {
          let html = '<div class="detail">';
          for (const [label, value] of rows) html += '<div class="detail-row"><span class="detail-label">' + label + '</span><span class="detail-value">' + value + '</span></div>';
          html += '</div>';
          document.getElementById('detailSection').innerHTML = html;
        }
      }

      if (pollTimer) clearInterval(pollTimer);
      if (['NOT_STARTED', 'IN_PROGRESS', 'PROCESSING_IMAGES'].includes(session.status)) {
        let count = 0;
        document.getElementById('refreshNote').innerHTML = '<div class="refresh-bar"><span class="spinner-sm"></span> Auto-refreshing...</div>';
        pollTimer = setInterval(async () => {
          count++;
          if (count > 60) { clearInterval(pollTimer); document.getElementById('refreshNote').innerHTML = ''; return; }
          const { data } = await supabase.from('sessions').select('session_id, status, first_name, last_name, document_type, document_number, date_of_birth, gender, issuing_state, created_at, updated_at').eq('session_id', session.session_id).single();
          if (data && ['IN_REVIEW', 'APPROVED', 'DECLINED', 'PROCESSING_FAILED'].includes(data.status)) { clearInterval(pollTimer); document.getElementById('refreshNote').innerHTML = ''; showResult(data); }
        }, 3000);
      }
    }

    window.resetSearch = function() {
      if (pollTimer) clearInterval(pollTimer);
      document.getElementById('searchSection').style.display = 'block';
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('sessionIdInput').value = '';
      document.getElementById('errorMsg').textContent = '';
    };
  </script>
</body>
</html>
